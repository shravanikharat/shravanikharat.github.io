    background: #fffbfc;
    color: #4a2436;
    line-height: 1.8;
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  header {
    position: relative;
    height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background-image: url('images/hero-bg.jpg');
    background-size: cover;
    background-position: center;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(74,10,40,0.15);
    z-index: 1;
  }
  header .content { position: relative; z-index: 2; }
  header .eyebrow {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 0.75rem;
    color: #fff;
    opacity: 0.9;
    margin-bottom: 18px;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 5rem;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 2px 30px rgba(60,10,30,0.35);
  }
  header .pronunciation {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.85rem;
    color: #fff;
    opacity: 0.9;
    letter-spacing: 1px;
    margin-top: 10px;
    font-style: italic;
  }
  header .line {
    width: 50px; height: 1px; background: #fff;
    opacity: 0.8;
    margin: 28px auto;
  }

  nav {
    display:flex; justify-content:center; gap:40px;
    padding: 22px; background: #fffbfc;
    position: sticky; top: 0; z-index: 50;
    border-bottom: 1px solid #fad2de;
    flex-wrap: wrap;
  }
  nav a {
    text-decoration:none; color:#b0245e;
    font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
    transition: color 0.25s;
  }
  nav a:hover { color:#4a2436; }

  .section-label {

    font-size: 0.75rem; color: #d6467c; margin-bottom: 14px;
